<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dark rounded backdrop matching the app UI -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0b1220"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Sun -->
  <g stroke="#fbbf24" stroke-width="3" stroke-linecap="round">
    <line x1="53" y1="23" x2="57" y2="23"/>
    <line x1="49.5" y1="31.5" x2="52.3" y2="34.3"/>
    <line x1="41" y1="11" x2="41" y2="7"/>
    <line x1="49.5" y1="14.5" x2="52.3" y2="11.7"/>
    <line x1="32.5" y1="14.5" x2="29.7" y2="11.7"/>
    <line x1="29" y1="23" x2="25" y2="23"/>
  </g>
  <circle cx="41" cy="23" r="9" fill="#fbbf24"/>

  <!-- Cloud -->
  <g fill="#e8eef7">
    <circle cx="33" cy="36" r="12"/>
    <circle cx="21" cy="42" r="8"/>
    <circle cx="44" cy="42" r="8"/>
